services:
  apexlink-postgres:
    image: postgres:16-alpine
    container_name: apexlink-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: apexlink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - apexlink_pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apexlink"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  apexlink_pg_data:
    driver: local
