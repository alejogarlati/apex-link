[ABOUT]
AUTHOR = Pyyer
VERSION = 5.2
DATE_RELEASE = 29 June 2025
;=============================================================
[INCLUDE]
INCLUDE = common\materials_track.ini, common\conditions.ini
;=============================================================
[DEFAULTS]
TRACK_FILE = imola.kn5
TRACK_FILE_KUNOS = imola.kn5
TRACK_FILE_FNR = fn_imola.kn5, fnr_imola.kn5
INSERT_AFTER_MESH_KUNOS = 01KERB
INSERT_AFTER_MESH_FNR = imola-ext
FILE_KERBS2025_KUNOS = ../imola_f1_2025/extension/kerbs2025.kn5
FILE_KERBS2025_FNR = ../imola_f1_2025/extension/kerbs2025_fnr.kn5
TRANSPARENT_TEXTURE = ../common/textures.zip::Transparent.dds
;=============================================================
LINES_TO_HIDE = '{(material:white line) & (!"?.replace?")}'
;-------------------------------------------------------------
[MODEL_REPLACEMENT_...]
ACTIVE = 1
FILE=$TRACK_FILE_KUNOS
INSERT=$FILE_KERBS2025_KUNOS
INSERT_AFTER=$INSERT_AFTER_MESH_KUNOS
HIDE = $LINES_TO_HIDE
;-------------------------------------------------------------
[MODEL_REPLACEMENT_...]
ACTIVE = 1
FILE=$TRACK_FILE_FNR
INSERT=$FILE_KERBS2025_FNR
INSERT_AFTER=$INSERT_AFTER_MESH_FNR
HIDE = $LINES_TO_HIDE

;-------------------------------------------------------------

[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Replace objects textures
MESHES = $LINES_TO_HIDE
SHADER = ksPerPixelAT
BLEND_MODE = ALPHA_TEST
RESOURCE_0 = txDiffuse
RESOURCE_FILE_0 = $TRANSPARENT_TEXTURE

[MESH_ADJUSTMENT_...]
ACTIVE = 1
MESHES = $LINES_TO_HIDE
IS_RENDERABLE = 0
;------------------------------------------------------------

[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Adjust brightness
MATERIALS = curbs-2025, apex-2025?, KerbPaintDark
PROP_... = ksAmbient, 0.2
PROP_... = ksDiffuse, 0.2