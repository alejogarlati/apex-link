[ABOUT]
AUTHOR = Pyyer
VERSION = 5.2
DATE_RELEASE = 29 June 2025

[INCLUDE]
INCLUDE = common/conditions.ini, common/materials_track.ini, common/custom_emissive.ini

[DEFAULTS]
TRACK_FILE_FNR = fn_imola.kn5, fnr_imola.kn5
MESHES_TO_HIDE_FNR_2025 = ?bm.replace?
MATERIALS_TO_HIDE_FNR_2025 = xxxxxxxxxxx
;-------------------------------------------------------------
[MODEL_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Hide objects
FILE = $TRACK_FILE_FNR
HIDE = $MESHES_TO_HIDE_FNR_2025

[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Replace objects textures
MESHES = $MESHES_TO_HIDE_FNR_2025
SHADER = ksPerPixelAT
BLEND_MODE = ALPHA_TEST
RESOURCE_0 = txDiffuse
RESOURCE_FILE_0 = ../common/textures.zip::Transparent.dds

[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Replace objects textures
MATERIALS = $MATERIALS_TO_HIDE_FNR_2025
SHADER = ksPerPixelAT
BLEND_MODE = ALPHA_TEST
RESOURCE_0 = txDiffuse
RESOURCE_FILE_0 = ../common/textures.zip::Transparent.dds
;------------------------------------------------------------

[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = No Gantry in 2025
MESHES = GantryPole2025?, GantrySponsor2025?
SHADER = ksPerPixelAT
BLEND_MODE = ALPHA_TEST
RESOURCE_0 = txDiffuse
RESOURCE_FILE_0 = ../common/textures.zip::Transparent.dds
;------------------------------------------------------------