[ABOUT]
AUTHOR = Pyyer
VERSION = 5.2
DATE_RELEASE = 29 June 2025

[INCLUDE]
INCLUDE=common/conditions.ini, common\materials_track.ini

[WIND]
DYNAMIC_FLAGS = AUTO

[DEFAULTS]
TRACK_FILE_KUNOS = imola.kn5
TRACK_FILE_FNR = fn_imola.kn5, fnr_imola.kn5
INSERT_AFTER_MESH_KUNOS = 01KERB
INSERT_AFTER_MESH_FNR = imola-ext
FILE_FLAGS_KUNOS = ../common/flags_new.kn5
FILE_FLAGS_FNR = ../common/flags_new.kn5

ORIGINAL_FLAGS = fLAG023, fLAG025, fLAG026, fLAG027, fLAG028, Mesh020?, Mesh021?, Mesh022?, Mesh023?, Mesh024?, Mesh025?, Mesh026?, Mesh027?, Object579, Object601, Object602, Object603, Object605
MESHES_NEW_FLAGS = FlagSeries?
TRANSPARENT_TEXTURE = ../common/textures.zip::Transparent.dds

;=============================================================
[MODEL_REPLACEMENT_...]
ACTIVE = 1
FILE=$TRACK_FILE_KUNOS
INSERT=$FILE_FLAGS_KUNOS
INSERT_AFTER=$INSERT_AFTER_MESH_KUNOS
HIDE = $ORIGINAL_FLAGS
;-------------------------------------------------------------
[MODEL_REPLACEMENT_...]
ACTIVE = 1
FILE=$TRACK_FILE_FNR
INSERT=$FILE_FLAGS_FNR
INSERT_AFTER=$INSERT_AFTER_MESH_FNR
HIDE = $ORIGINAL_FLAGS

;-------------------------------------------------------------

[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Hide original flags
MESHES = $ORIGINAL_FLAGS
SHADER = ksPerPixelAT
BLEND_MODE = ALPHA_TEST
RESOURCE_0 = txDiffuse
RESOURCE_FILE_0 = $TRANSPARENT_TEXTURE
;=============================================================
[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Replace flags textures
MESHES = texture:FlagImola.dds
RESOURCE_0 = txDiffuse
RESOURCE_FILE_0 = ../common/flags.zip::flagF1.dds
;------------------------------------------------------------
[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Replace flags textures
MESHES = texture:FlagImola.white.dds
RESOURCE_0 = txDiffuse
RESOURCE_FILE_0 = ../common/flags.zip::flagF1.white.dds
;=============================================================

[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Replace flags textures
MESHES = FlagSeries4?, FlagPole4?
SHADER = ksPerPixelAT
BLEND_MODE = ALPHA_TEST
RESOURCE_0 = txDiffuse
RESOURCE_FILE_0 = ../common/textures.zip::transparent.dds
;------------------------------------------------------------

[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Replace objects textures
MESHES = $MESHES_NEW_FLAGS
SHADER = ksFlagsFX
PROP_... = ksAmbient, 0.3
PROP_... = ksDiffuse, 0.3
PROP_... = ksSpecular, 0.1
PROP_... = ksSpecularEXP, 100
PROP_... = frequency, 1.5
PROP_... = distortion, 0.075
;----------------------------------------------------------

[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Enable Flags
MESHES = $MESHES_NEW_FLAGS
SHADER = ksFlagsFX

;----------------------------------------------------------