[GROUPS]
DISQUALIFIED=0 ; how many sections for disqualified lights
READY=5 ; how many steps/sections for red lights
START=1 ; how many steps for green lights

[COLOR]
INTENSITY=6 ; 0.2 is barely visible, 10 is too much, nearly white, off-color depends on your base material
; DIFFUSE=0.2 ; read this the first time ?

[OBJECT_0]
TYPE=1
NAME=AC_SEMAPHORE_RED_1 ; your object name in 3d model for first red light
ORDER=0 ; wich order in 1 of 4

[OBJECT_1]
TYPE=1
NAME=AC_SEMAPHORE_RED_2 ; your object name in 3d model for second red light
ORDER=1

[OBJECT_2]
TYPE=1
NAME=AC_SEMAPHORE_RED_3
ORDER=2

[OBJECT_3]
TYPE=1
NAME=AC_SEMAPHORE_RED_4
ORDER=3

[OBJECT_4]
TYPE=1
NAME=AC_SEMAPHORE_RED_5
ORDER=4

[OBJECT_5]
TYPE=2
NAME=AC_SEMAPHORE_GREEN_1
ORDER=0

[OBJECT_6]
TYPE=2
NAME=AC_SEMAPHORE_GREEN_1a ; if you have another green light somewhere else, you can insert that too
ORDER=0