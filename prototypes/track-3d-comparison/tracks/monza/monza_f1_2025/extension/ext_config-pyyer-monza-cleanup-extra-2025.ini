[ABOUT]
AUTHOR = Pyyer
VERSION = 7.0
DATE_RELEASE = 06 September 2025

[INCLUDE]
INCLUDE = common/conditions.ini, common/materials_track.ini

;=============================================================

[DEFAULTS]
TRACK_FILE = monza.kn5
EXTRA_HIDE_2025 = Box099, Line061, Line092, Box130, Object487, metals17.replace.002, ?.replace.brakemarkers, Box121
TREES_HIDE_2025 = I?.replace.option
;=============================================================

[MODEL_REPLACEMENT_...]
FILE=$TRACK_FILE
HIDE = $EXTRA_HIDE_2025, $TREES_HIDE_2025

;=============================================================
[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Cleanup original meshes
MESHES = $EXTRA_HIDE_2025, $TREES_HIDE_2025
SHADER = ksPerPixelAT
BLEND_MODE = ALPHA_TEST
RESOURCE_0 = txDiffuse
RESOURCE_FILE_0 = ../common/textures.zip::Transparent.dds

[MESH_ADJUSTMENT_...]
ACTIVE = 1
DESCRIPTION = Cleanup original meshes
MESHES = $EXTRA_HIDE_2025, $TREES_HIDE_2025
IS_RENDERABLE = 0

;=============================================================