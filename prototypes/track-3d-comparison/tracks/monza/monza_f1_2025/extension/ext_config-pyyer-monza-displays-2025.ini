[ABOUT]
AUTHOR = Pyyer
VERSION = 7.0
DATE_RELEASE = 06 September 2025

[INCLUDE]
INCLUDE = common/conditions.ini, common/materials_track.ini

;=============================================================

[DEFAULTS]
TRACK_FILE = monza.kn5
DISPLAY_KN5 = ../common/displays.kn5
DISPLAYS_TO_HIDE = xxxxxxxxxxxxx

;=============================================================

[MODEL_REPLACEMENT_...]
FILE=$DISPLAY_KN5
HIDE = $DISPLAYS_TO_HIDE

;=============================================================

[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Cleanup original meshes
MESHES = $DISPLAYS_TO_HIDE
SHADER = ksPerPixelAT
BLEND_MODE = ALPHA_TEST
RESOURCE_0 = txDiffuse
RESOURCE_FILE_0 = ../common/textures.zip::Transparent.dds

[MESH_ADJUSTMENT_...]
ACTIVE = 1
DESCRIPTION = Cleanup original meshes
MESHES = $DISPLAYS_TO_HIDE
IS_RENDERABLE = 0

;=============================================================