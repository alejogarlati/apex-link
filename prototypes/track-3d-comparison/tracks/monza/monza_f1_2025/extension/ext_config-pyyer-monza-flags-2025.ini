[ABOUT]
AUTHOR = Pyyer
VERSION = 7.0
DATE_RELEASE = 06 September 2025

[INCLUDE]
INCLUDE=common/conditions.ini, common\materials_track.ini

[BASIC]
SUPPORTS_WIND=1

[WIND]
DYNAMIC_FLAGS = AUTO

[DEFAULTS]
TRACK_FILE = monza.kn5
INSERTION_FILE = extensions_insert.kn5
ORIGINAL_FLAGS = Object603, fLAG027, Object613, Object614, fLAG028, fLAG029
ORIGINAL_FLAG_POLES = Mesh026, Mesh027, Mesh028
INSERT_AFTER_MESH = pyyer

;=============================================================
[MODEL_REPLACEMENT_...]
ACTIVE = 0
FILE=$INSERTION_FILE
INSERT= ../common/flags.kn5
INSERT_AFTER=$INSERT_AFTER_MESH
;=============================================================
[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Animate flag
MESHES = $ORIGINAL_FLAGS
SHADER = ksFlagsFX
PROP_... = ksAmbient, 0.3
PROP_... = ksDiffuse, 0.3
PROP_... = ksSpecular, 0.1
PROP_... = ksSpecularEXP, 100
PROP_... = frequency, 1.5
PROP_... = distortion, 0.075
;=============================================================
[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Replace flags textures
MESHES = Object603
RESOURCE_0 = txDiffuse
RESOURCE_FILE_0 = ../common/flags.zip::flagQatarAirways.dds

;----------------------------------------------------------
[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Replace flags textures
MESHES = fLAG027
RESOURCE_0 = txDiffuse
RESOURCE_FILE_0 = ../common/flags.zip::flagQatarAirways.dds

;----------------------------------------------------------
[SHADER_REPLACEMENT_...]
ACTIVE = 1
DESCRIPTION = Replace flags textures
MESHES = Object613, Object614, fLAG028, fLAG029
RESOURCE_0 = txDiffuse
RESOURCE_FILE_0 = ../common/flags.zip::flagF1.dds

;----------------------------------------------------------